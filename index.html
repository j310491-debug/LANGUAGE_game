<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>連假注音小達人</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.45); }
      50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
    }
    .animate-pop { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-shake { animation: shake 0.32s ease-in-out; }
    .key-hint-glow {
      animation: pulseGlow 1.4s infinite;
      border-color: #3b82f6 !important;
      background-color: rgba(59, 130, 246, 0.2) !important;
    }
    .zhuyin-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .zhuyin-phonetics {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.05;
      font-weight: 700;
    }
    .zhuyin-tone {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4 select-none">

  <div class="max-w-4xl mx-auto space-y-4">

    <!-- 頂部：四天連假切換與獎牌狀態 -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between gap-3">
        <h1 class="text-lg md:text-xl font-bold tracking-tight flex items-center gap-2">
          <span>🎯 連假注音練習</span>
        </h1>
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-[var(--muted-foreground)]">
            獎牌 <strong id="medalCountText" class="text-amber-500">0 / 4</strong>
          </span>
          <div id="medalRack" class="flex items-center gap-1.5"></div>
        </div>
      </div>

      <!-- 10/23 ~ 10/26 日期分頁 -->
      <div id="dayTabs" class="grid grid-cols-4 gap-2"></div>
    </header>

    <!-- 題目與輸入選字主區 -->
    <section class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 md:p-5 shadow-sm space-y-4">

      <!-- 題號進度列 ＋ 輔助開關 -->
      <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
        <div class="flex items-center gap-1.5 flex-wrap">
          <div id="sentenceDots" class="flex items-center gap-1"></div>
          <span id="sentenceProgressLabel" class="text-xs font-semibold text-[var(--muted-foreground)] ml-1">
            1 / 10
          </span>
        </div>

        <div class="flex items-center gap-2">
          <button id="toggleKeyHintBtn" onclick="toggleKeyHint()" class="px-2.5 py-1 rounded-lg text-xs font-semibold border border-[var(--border)] transition">
            💡 鍵位提示：<span id="keyHintStatus">開</span>
          </button>
          <button onclick="prevSentence()" class="px-2.5 py-1 rounded-lg text-xs border border-[var(--border)] hover:bg-[var(--secondary)] transition">
            ◀ 上一題
          </button>
          <button onclick="nextSentence()" class="px-2.5 py-1 rounded-lg text-xs border border-[var(--border)] hover:bg-[var(--secondary)] transition">
            下一題 ▶
          </button>
        </div>
      </div>

      <!-- 完整短句直接呈現（供玩家對照選字） -->
      <div class="flex items-center justify-between gap-3 bg-[var(--background)] border border-[var(--border)] rounded-xl px-4 py-3">
        <div class="flex items-center gap-2.5 flex-wrap">
          <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-500/15 text-amber-500">
            目標短句
          </span>
          <div id="fullSentenceDisplay" class="text-xl md:text-2xl font-extrabold tracking-wide">
            <!-- JS 渲染完整短句，並標示目前所在的字 -->
          </div>
        </div>
        <button onclick="speakCurrentSentence()" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition flex items-center gap-1">
          🔊 朗讀
        </button>
      </div>

      <!-- 逐字注音進度卡片列 -->
      <div id="sentenceBoard" class="flex flex-wrap items-center justify-center gap-2 py-3 px-2 bg-[var(--background)] border border-[var(--border)] rounded-xl min-h-[104px]">
      </div>

      <!-- 輸入緩衝區 ＆ 選字欄 -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
        <!-- 左：目標注音 ➔ 目前輸入 -->
        <div class="md:col-span-5 bg-[var(--background)] border border-[var(--border)] rounded-xl p-3 flex items-center justify-around gap-2">
          <div class="text-center">
            <div class="text-xs text-[var(--muted-foreground)] mb-1">目標注音</div>
            <div id="targetZhuyinBig" class="px-3 py-2 rounded-xl bg-[var(--card)] border border-[var(--border)] text-2xl font-bold tracking-wider text-amber-500 min-w-[96px]">
              ㄗㄠˇ
            </div>
          </div>

          <div class="text-base text-[var(--muted-foreground)] font-bold">➔</div>

          <div class="text-center flex-1">
            <div class="text-xs text-[var(--muted-foreground)] mb-1">你的輸入</div>
            <div id="inputBufferBox" class="px-3 py-2 rounded-xl bg-[var(--card)] border-2 border-blue-500/50 text-2xl font-bold tracking-wider min-h-[48px] flex items-center justify-center gap-1">
            </div>
          </div>
        </div>

        <!-- 右：4 個候選字 -->
        <div class="md:col-span-7 bg-[var(--background)] border border-[var(--border)] rounded-xl p-3 space-y-2">
          <div id="candidateContainer" class="grid grid-cols-4 gap-2"></div>
          <div id="feedbackBanner" class="text-xs font-medium text-center py-1 px-2 rounded-lg bg-[var(--card)] text-[var(--muted-foreground)]">
            請輸入注音與聲調
          </div>
        </div>
      </div>

    </section>

    <!-- 注音鍵盤區 -->
    <section class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm space-y-2.5">
      <!-- 聲調列 ＋ 倒退/清空 -->
      <div class="grid grid-cols-7 gap-1.5">
        <button data-zhuyin="ˉ" onclick="inputSymbol('ˉ')" class="zhuyin-key py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] transition flex flex-col items-center justify-center">
          <span class="text-sm md:text-base font-extrabold text-amber-500">ˉ 一聲</span>
          <span class="text-xs text-[var(--muted-foreground)]">Space</span>
        </button>
        <button data-zhuyin="ˊ" onclick="inputSymbol('ˊ')" class="zhuyin-key py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] transition flex flex-col items-center justify-center">
          <span class="text-sm md:text-base font-extrabold text-amber-500">ˊ 二聲</span>
          <span class="text-xs text-[var(--muted-foreground)]">6</span>
        </button>
        <button data-zhuyin="ˇ" onclick="inputSymbol('ˇ')" class="zhuyin-key py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] transition flex flex-col items-center justify-center">
          <span class="text-sm md:text-base font-extrabold text-amber-500">ˇ 三聲</span>
          <span class="text-xs text-[var(--muted-foreground)]">3</span>
        </button>
        <button data-zhuyin="ˋ" onclick="inputSymbol('ˋ')" class="zhuyin-key py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] transition flex flex-col items-center justify-center">
          <span class="text-sm md:text-base font-extrabold text-amber-500">ˋ 四聲</span>
          <span class="text-xs text-[var(--muted-foreground)]">4</span>
        </button>
        <button data-zhuyin="˙" onclick="inputSymbol('˙')" class="zhuyin-key py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] transition flex flex-col items-center justify-center">
          <span class="text-sm md:text-base font-extrabold text-amber-500">˙ 輕聲</span>
          <span class="text-xs text-[var(--muted-foreground)]">7</span>
        </button>
        <button onclick="handleBackspace()" class="py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition flex flex-col items-center justify-center font-bold text-xs">
          <span>⌫ 倒退</span>
          <span class="text-[var(--muted-foreground)] font-normal">Back</span>
        </button>
        <button onclick="clearInputBuffer()" class="py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition flex flex-col items-center justify-center font-bold text-xs">
          <span>🗑️ 重打</span>
          <span class="text-[var(--muted-foreground)] font-normal">Esc</span>
        </button>
      </div>

      <!-- 大千排列 4 列注音鍵盤 -->
      <div id="keyboardRows" class="space-y-1.5 pt-1"></div>

      <div class="flex justify-end pt-1">
        <button onclick="resetAllProgress()" class="text-xs text-[var(--muted-foreground)] hover:text-rose-400 transition">
          重置紀錄
        </button>
      </div>
    </section>

  </div>

  <!-- 獲得獎牌慶祝彈窗 -->
  <div id="medalModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl max-w-md w-full p-6 text-center shadow-xl animate-pop space-y-4">
      <div id="modalMedalIcon" class="w-24 h-24 mx-auto rounded-full flex items-center justify-center text-5xl bg-amber-500/15 border-2 border-amber-400 shadow-inner">
        🏅
      </div>
      <div class="space-y-1">
        <div id="modalDayBadge" class="text-xs font-bold uppercase tracking-widest text-amber-500">
          10/23 任務完成
        </div>
        <h3 id="modalTitle" class="text-2xl font-extrabold">
          獲得「啟程之星獎牌」！
        </h3>
        <p id="modalDesc" class="text-sm text-[var(--muted-foreground)]">
          太棒了！你已完成今天全部 10 句練習！
        </p>
      </div>
      <div id="allMedalsBanner" class="hidden p-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-400 text-xs font-bold">
        🎉 恭喜集滿 10/23～10/26 全部 4 面獎牌！
      </div>
      <div class="flex items-center justify-center gap-3 pt-2">
        <button onclick="closeMedalModal()" class="px-4 py-2 rounded-xl text-sm font-semibold border border-[var(--border)] hover:bg-[var(--secondary)] transition">
          留在今日
        </button>
        <button id="nextDayModalBtn" onclick="goToNextDayFromModal()" class="px-5 py-2 rounded-xl text-sm font-bold bg-amber-500 text-black hover:bg-amber-400 transition">
          下一天挑戰 ➔
        </button>
      </div>
    </div>
  </div>

    function createEmptyCompleted() {
      return HOLIDAY_DATA.map(day => new Array(day.sentences.length).fill(false));
    }

      currentDayIdx: 0,

    function loadProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.completed && parsed.completed.length === 4 && parsed.completed[0].length === 10) {
            state.completed = parsed.completed;
          }
          if (parsed.medals && parsed.medals.length === 4) {
            state.medals = parsed.medals;
          }
        }
      } catch (e) {}
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          completed: state.completed,
          medals: state.medals
        }));
      } catch (e) {}
    }

    let audioCtx = null;
    function playToneSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        if (type === 'key') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'unlock') {
          [587.33, 880].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.07);
            gain.gain.setValueAtTime(0.09, now + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.14);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.07);
            osc.stop(now + i * 0.07 + 0.14);
          });
        } else if (type === 'correct') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.1, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.18);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.2);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'medal') {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.09);
            gain.gain.setValueAtTime(0.14, now + i * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.09);
            osc.stop(now + i * 0.09 + 0.35);
          });
        }
      } catch (e) {}
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.92;
      window.speechSynthesis.speak(utter);
    }

    function speakCurrentSentence() {
      const sentenceObj = getCurrentSentence();
      const fullText = sentenceObj.chars.map(c => c.char).join('');
      speakText(fullText);
    }

    function getCurrentDay() {
      return HOLIDAY_DATA[state.currentDayIdx];
    }

    function getCurrentSentence() {
      return getCurrentDay().sentences[state.currentSentenceIdx];
    }

    function getCurrentCharObj() {
      return getCurrentSentence().chars[state.currentCharIdx];
    }

    function parseTargetSlots(charObj) {
      let initial = '', medial = '', rime = '';
      for (const sym of charObj.phonetics) {
        if (INITIALS.has(sym)) initial = sym;
        else if (MEDIALS.has(sym)) medial = sym;
        else if (RIMES.has(sym)) rime = sym;
      }
      return { initial, medial, rime, tone: charObj.tone };
    }

    function formatZhuyinDisplay(phonetics, tone) {
      if (tone === '˙') return '˙' + phonetics;
      if (tone === 'ˉ') return phonetics + 'ˉ';
      return phonetics + tone;
    }

    function renderKeyboard() {
      const container = document.getElementById('keyboardRows');
      container.innerHTML = KEYBOARD_LAYOUT.map((row, rIdx) => {
        const paddingClass = rIdx === 1 ? 'pl-2' : rIdx === 2 ? 'pl-4' : rIdx === 3 ? 'pl-6' : '';
        return `
          <div class="grid grid-cols-11 gap-1.5 ${paddingClass}">
            ${row.map(item => `
              <button
                data-zhuyin="${item.zhuyin}"
                onclick="inputSymbol('${item.zhuyin}')"
                class="zhuyin-key py-2 px-1 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] active:scale-95 transition flex flex-col items-center justify-center shadow-sm"
              >
                <span class="text-base md:text-lg font-extrabold leading-tight">${item.zhuyin}</span>
                <span class="text-xs text-[var(--muted-foreground)] font-mono">${item.key}</span>
              </button>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function renderMedalRack() {
      const rack = document.getElementById('medalRack');
      const countText = document.getElementById('medalCountText');
      const earnedCount = state.medals.filter(Boolean).length;
      countText.textContent = `${earnedCount} / 4`;

      rack.innerHTML = HOLIDAY_DATA.map((day, idx) => {
        const earned = state.medals[idx];
        return `
          <button
            onclick="selectDay(${idx})"
            title="${day.date} ${day.medalName}"
            class="w-8 h-8 rounded-lg border flex items-center justify-center text-base transition ${
              earned
                ? 'bg-amber-500/15 border-amber-400 text-amber-400'
                : 'bg-[var(--background)] border-[var(--border)] opacity-40'
            }"
          >
            ${earned ? day.medalEmoji : '🔒'}
          </button>
        `;
      }).join('');
    }

    function renderDayTabs() {
      const tabs = document.getElementById('dayTabs');
      tabs.innerHTML = HOLIDAY_DATA.map((day, idx) => {
        const isActive = idx === state.currentDayIdx;
        const doneCount = state.completed[idx].filter(Boolean).length;
        const totalCount = day.sentences.length;
        const earned = state.medals[idx];

        return `
          <button
            onclick="selectDay(${idx})"
            class="py-2 px-3 rounded-xl border text-left transition flex items-center justify-between ${
              isActive
                ? 'bg-[var(--secondary)] border-amber-500 ring-2 ring-amber-500/30'
                : 'bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]/60'
            }"
          >
            <div>
              <div class="text-sm font-extrabold ${isActive ? 'text-amber-500' : ''}">${day.date}</div>
              <div class="text-xs text-[var(--muted-foreground)]">${doneCount}/${totalCount} 題</div>
            </div>
            <span class="text-lg">${earned ? day.medalEmoji : ''}</span>
          </button>
        `;
      }).join('');
    }

    function renderToolbar() {
      const day = getCurrentDay();
      const dots = document.getElementById('sentenceDots');
      dots.innerHTML = day.sentences.map((_, sIdx) => {
        const isDone = state.completed[state.currentDayIdx][sIdx];
        const isCurrent = sIdx === state.currentSentenceIdx;
        return `
          <button
            onclick="selectSentence(${sIdx})"
            class="w-6 h-6 rounded-lg text-xs font-bold border transition flex items-center justify-center ${
              isCurrent
                ? 'border-amber-500 bg-amber-500 text-black'
                : isDone
                ? 'border-emerald-500/50 bg-emerald-500/15 text-emerald-400'
                : 'border-[var(--border)] bg-[var(--background)] text-[var(--muted-foreground)]'
            }"
          >
            ${isDone ? '✓' : sIdx + 1}
          </button>
        `;
      }).join('');

      document.getElementById('sentenceProgressLabel').textContent =
        `第 ${state.currentSentenceIdx + 1} / ${day.sentences.length} 題`;

      document.getElementById('keyHintStatus').textContent = state.showKeyHint ? '開' : '關';
      document.getElementById('toggleKeyHintBtn').className = `px-2.5 py-1 rounded-lg text-xs font-semibold border transition ${
        state.showKeyHint ? 'border-blue-500/50 bg-blue-500/15 text-blue-400' : 'border-[var(--border)] bg-[var(--background)] text-[var(--muted-foreground)]'
      }`;
    }

    function renderSentenceBoard() {
      const sentence = getCurrentSentence();

      // 直接呈現完整目標短句，並高亮目前正在打的字
      const fullDisplay = document.getElementById('fullSentenceDisplay');
      fullDisplay.innerHTML = sentence.chars.map((item, idx) => {
        const isDone = idx < state.currentCharIdx;
        const isCurrent = idx === state.currentCharIdx;
        if (isCurrent) {
          return `<span class="text-amber-500 underline decoration-2 underline-offset-4 px-0.5">${item.char}</span>`;
        }
        if (isDone) {
          return `<span class="text-emerald-400">${item.char}</span>`;
        }
        return `<span>${item.char}</span>`;
      }).join('');

      // 渲染逐字注音卡片（未完成的字隱藏國字，讓玩家透過上方完整短句對照選字）
      const board = document.getElementById('sentenceBoard');
      board.innerHTML = sentence.chars.map((item, idx) => {
        if (item.isPunct) {
          return `
            <div class="px-1 py-2 text-2xl font-bold text-[var(--muted-foreground)] self-center">
              ${item.char}
            </div>
          `;
        }

        const isDone = idx < state.currentCharIdx;
        const isCurrent = idx === state.currentCharIdx;
        const pChars = item.phonetics.split('');
        const isLightTone = item.tone === '˙';
        const displayTone = item.tone === 'ˉ' ? '' : item.tone;

        return `
          <div
            onclick="jumpToChar(${idx})"
            class="cursor-pointer rounded-xl border px-2.5 py-2 min-w-[68px] transition flex items-center justify-center gap-1.5 ${
              isCurrent
                ? 'bg-amber-500/15 border-2 border-amber-500 shadow-sm scale-105'
                : isDone
                ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-400'
                : 'bg-[var(--card)] border-[var(--border)] opacity-75'
            }"
          >
            <div class="text-2xl font-extrabold w-8 h-8 flex items-center justify-center rounded-lg ${
              isDone ? '' : 'bg-[var(--background)] border border-dashed border-[var(--border)] text-sm text-amber-500'
            }">
              ${isDone ? item.char : (isCurrent ? '？' : '')}
            </div>

            <div class="zhuyin-box text-xs">
              <div class="zhuyin-phonetics text-amber-500">
                ${isLightTone ? '<span class="text-xs leading-none">˙</span>' : ''}
                ${pChars.map(p => `<span>${p}</span>`).join('')}
              </div>
              ${!isLightTone && displayTone ? `<div class="zhuyin-tone text-amber-400 text-xs">${displayTone}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCurrentTargetPanel() {
      const charObj = getCurrentCharObj();
      if (!charObj || charObj.isPunct) return;

      document.getElementById('targetZhuyinBig').textContent =
        formatZhuyinDisplay(charObj.phonetics, charObj.tone);

      const { initial, medial, rime, tone } = state.buffer;
      const hasAny = initial || medial || rime || tone;
      const bufferBox = document.getElementById('inputBufferBox');

      if (!hasAny) {
        bufferBox.innerHTML = `<span class="text-xs text-[var(--muted-foreground)] font-normal">等待輸入</span>`;
      } else {
        bufferBox.innerHTML = `
          ${tone === '˙' ? `<span class="text-amber-400">${tone}</span>` : ''}
          ${initial ? `<span class="text-rose-400">${initial}</span>` : ''}
          ${medial ? `<span class="text-emerald-400">${medial}</span>` : ''}
          ${rime ? `<span class="text-sky-400">${rime}</span>` : ''}
          ${tone && tone !== '˙' ? `<span class="text-amber-400">${tone}</span>` : ''}
        `;
      }

      const candContainer = document.getElementById('candidateContainer');
      if (!state.isSelectingCandidate) {
        candContainer.innerHTML = [1, 2, 3, 4].map(num => `
          <button disabled class="py-2 px-2 rounded-xl border border-[var(--border)] bg-[var(--card)] opacity-35 flex items-center justify-center gap-1.5">
            <span class="text-xs text-[var(--muted-foreground)] font-mono">${num}.</span>
            <span class="text-xl font-bold">？</span>
          </button>
        `).join('');
      } else {
        candContainer.innerHTML = state.currentCandidates.map((candChar, idx) => `
          <button
            onclick="selectCandidate(${idx})"
            class="py-2 px-2 rounded-xl border-2 border-amber-500 bg-[var(--card)] hover:bg-amber-500/20 active:scale-95 transition flex items-center justify-center gap-1.5 shadow-sm animate-pop"
          >
            <span class="text-xs text-amber-400 font-mono font-bold">${idx + 1}.</span>
            <span class="text-2xl font-extrabold">${candChar}</span>
          </button>
        `).join('');
      }

      updateKeyboardHighlights();
    }

    function updateKeyboardHighlights() {
      const allKeys = document.querySelectorAll('.zhuyin-key');
      allKeys.forEach(btn => btn.classList.remove('key-hint-glow'));

      if (!state.showKeyHint || state.isSelectingCandidate) return;

      const charObj = getCurrentCharObj();
      if (!charObj || charObj.isPunct) return;

      const target = parseTargetSlots(charObj);
      let nextNeeded = '';
      if (target.initial && state.buffer.initial !== target.initial) nextNeeded = target.initial;
      else if (target.medial && state.buffer.medial !== target.medial) nextNeeded = target.medial;
      else if (target.rime && state.buffer.rime !== target.rime) nextNeeded = target.rime;
      else if (target.tone && state.buffer.tone !== target.tone) nextNeeded = target.tone;

      if (nextNeeded) {
        allKeys.forEach(btn => {
          if (btn.getAttribute('data-zhuyin') === nextNeeded) {
            btn.classList.add('key-hint-glow');
          }
        });
      }
    }

    function renderAll() {
      renderMedalRack();
      renderDayTabs();
      renderToolbar();
      renderSentenceBoard();
      renderCurrentTargetPanel();
    }

    function inputSymbol(sym) {
      if (state.isSelectingCandidate) return;

      const charObj = getCurrentCharObj();
      if (!charObj || charObj.isPunct) return;

      playToneSound('key');

      if (INITIALS.has(sym)) {
        state.buffer.initial = sym;
      } else if (MEDIALS.has(sym)) {
        state.buffer.medial = sym;
      } else if (RIMES.has(sym)) {
        state.buffer.rime = sym;
      } else if (TONES.has(sym)) {
        state.buffer.tone = sym;
      }

      renderCurrentTargetPanel();

      if (TONES.has(sym)) {
        verifyZhuyinBuffer();
      } else {
        setFeedback('請繼續輸入注音或聲調', 'normal');
      }
    }

    function verifyZhuyinBuffer() {
      const charObj = getCurrentCharObj();
      const target = parseTargetSlots(charObj);
      const b = state.buffer;

      const isMatch =
        b.initial === target.initial &&
        b.medial === target.medial &&
        b.rime === target.rime &&
        b.tone === target.tone;

      if (isMatch) {
        playToneSound('unlock');
        state.isSelectingCandidate = true;
        const shuffled = [...charObj.options];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        state.currentCandidates = shuffled;
        setFeedback('✨ 請對照上方短句，選出正確的字（1~4）', 'success');
        renderCurrentTargetPanel();
      } else {
        playToneSound('wrong');
        let wrongParts = [];
        if (b.initial !== target.initial) wrongParts.push(`聲母「${target.initial || '無'}」`);
        if (b.medial !== target.medial) wrongParts.push(`介音「${target.medial || '無'}」`);
        if (b.rime !== target.rime) wrongParts.push(`韻母「${target.rime || '無'}」`);
        if (b.tone !== target.tone) wrongParts.push(`聲調「${target.tone}」`);

        setFeedback(`❌ 請檢查：${wrongParts.join('、')}`, 'error');
        const box = document.getElementById('inputBufferBox');
        box.classList.remove('animate-shake');
        void box.offsetWidth;
        box.classList.add('animate-shake');
        state.buffer.tone = '';
        setTimeout(() => renderCurrentTargetPanel(), 300);
      }
    }

    function selectCandidate(index) {
      if (!state.isSelectingCandidate) return;
      const chosen = state.currentCandidates[index];
      if (!chosen) return;

      const charObj = getCurrentCharObj();
      if (chosen === charObj.char) {
        playToneSound('correct');
        speakText(charObj.char);
        setFeedback(`🎉 正確！「${charObj.char}」`, 'success');
        advanceToNextChar();
      } else {
        playToneSound('wrong');
        setFeedback(`🤔 不是「${chosen}」喔，請對照上方目標短句再選一次！`, 'error');
      }
    }

    function advanceToNextChar() {
      const sentence = getCurrentSentence();
      state.buffer = { initial: '', medial: '', rime: '', tone: '' };
      state.isSelectingCandidate = false;
      state.currentCandidates = [];

      let nextIdx = state.currentCharIdx + 1;
      while (nextIdx < sentence.chars.length && sentence.chars[nextIdx].isPunct) {
        nextIdx++;
      }

      if (nextIdx < sentence.chars.length) {
        state.currentCharIdx = nextIdx;
        renderAll();
      } else {
        state.currentCharIdx = sentence.chars.length;
        renderSentenceBoard();
        handleSentenceComplete();
      }
    }

    function handleSentenceComplete() {
      const dIdx = state.currentDayIdx;
      const sIdx = state.currentSentenceIdx;
      state.completed[dIdx][sIdx] = true;

      const allDoneToday = state.completed[dIdx].every(Boolean);
      const wasMedalEarned = state.medals[dIdx];
      if (allDoneToday) {
        state.medals[dIdx] = true;
      }
      saveProgress();
      renderAll();

      setTimeout(() => speakCurrentSentence(), 250);

      if (allDoneToday && !wasMedalEarned) {
        setTimeout(() => showMedalModal(dIdx), 700);
      } else {
        setFeedback('🎊 完成本句！即將進入下一題...', 'success');
        setTimeout(() => {
          const nextIncomplete = state.completed[dIdx].findIndex(done => !done);
          if (nextIncomplete !== -1) {
            selectSentence(nextIncomplete);
          } else if (sIdx + 1 < getCurrentDay().sentences.length) {
            selectSentence(sIdx + 1);
          } else {
            selectSentence(0);
          }
        }, 1400);
      }
    }

    function setFeedback(msg, type) {
      const banner = document.getElementById('feedbackBanner');
      banner.textContent = msg;
      if (type === 'success') {
        banner.className = 'text-xs font-semibold text-center py-1 px-2 rounded-lg bg-emerald-500/15 text-emerald-400';
      } else if (type === 'error') {
        banner.className = 'text-xs font-semibold text-center py-1 px-2 rounded-lg bg-rose-500/15 text-rose-400';
      } else {
        banner.className = 'text-xs font-medium text-center py-1 px-2 rounded-lg bg-[var(--card)] text-[var(--muted-foreground)]';
      }
    }

    function handleBackspace() {
      if (state.isSelectingCandidate) {
        state.isSelectingCandidate = false;
        state.buffer.tone = '';
        renderCurrentTargetPanel();
        return;
      }
      const b = state.buffer;
      if (b.tone) b.tone = '';
      else if (b.rime) b.rime = '';
      else if (b.medial) b.medial = '';
      else if (b.initial) b.initial = '';
      renderCurrentTargetPanel();
    }

    function clearInputBuffer() {
      state.buffer = { initial: '', medial: '', rime: '', tone: '' };
      state.isSelectingCandidate = false;
      renderCurrentTargetPanel();
      setFeedback('請輸入注音與聲調', 'normal');
    }

    function toggleKeyHint() {
      state.showKeyHint = !state.showKeyHint;
      renderToolbar();
      updateKeyboardHighlights();
    }

    function selectDay(dayIdx) {
      state.currentDayIdx = dayIdx;
      const firstIncomplete = state.completed[dayIdx].findIndex(done => !done);
      state.currentSentenceIdx = firstIncomplete !== -1 ? firstIncomplete : 0;
      resetCharPointer();
      renderAll();
    }

    function selectSentence(sIdx) {
      state.currentSentenceIdx = sIdx;
      resetCharPointer();
      renderAll();
    }

    function prevSentence() {
      const total = getCurrentDay().sentences.length;
      selectSentence((state.currentSentenceIdx - 1 + total) % total);
    }

    function nextSentence() {
      const total = getCurrentDay().sentences.length;
      selectSentence((state.currentSentenceIdx + 1) % total);
    }

    function jumpToChar(charIdx) {
      const sentence = getCurrentSentence();
      if (sentence.chars[charIdx].isPunct) return;
      state.currentCharIdx = charIdx;
      state.buffer = { initial: '', medial: '', rime: '', tone: '' };
      state.isSelectingCandidate = false;
      renderAll();
    }

    function resetCharPointer() {
      state.currentCharIdx = 0;
      state.buffer = { initial: '', medial: '', rime: '', tone: '' };
      state.isSelectingCandidate = false;
      state.currentCandidates = [];
      setFeedback('請輸入注音與聲調', 'normal');
    }

    function showMedalModal(dayIdx) {
      playToneSound('medal');
      const day = HOLIDAY_DATA[dayIdx];
      document.getElementById('modalMedalIcon').textContent = day.medalEmoji;
      document.getElementById('modalDayBadge').textContent = `${day.date} 任務完成`;
      document.getElementById('modalTitle').textContent = `獲得「${day.medalName}」！`;
      document.getElementById('modalDesc').textContent = `太棒了！你已完成 ${day.date} 全部 10 題練習！`;

      const allEarned = state.medals.every(Boolean);
      const banner = document.getElementById('allMedalsBanner');
      if (allEarned) {
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }

      const modal = document.getElementById('medalModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeMedalModal() {
      const modal = document.getElementById('medalModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      selectSentence(0);
    }

    function goToNextDayFromModal() {
      closeMedalModal();
      const nextDay = (state.currentDayIdx + 1) % HOLIDAY_DATA.length;
      selectDay(nextDay);
    }

    function resetAllProgress() {
      if (!confirm('確定要重置所有練習紀錄嗎？')) return;
      state.completed = createEmptyCompleted();
      state.medals = [false, false, false, false];
      saveProgress();
      selectDay(0);
    }

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      if (state.isSelectingCandidate) {
        if (['1', '2', '3', '4'].includes(e.key)) {
          e.preventDefault();
          selectCandidate(parseInt(e.key, 10) - 1);
          return;
        }
        if (e.key === 'Backspace' || e.key === 'Escape') {
          e.preventDefault();
          handleBackspace();
          return;
        }
        return;
      }

      if (e.key === 'Backspace') {
        e.preventDefault();
        handleBackspace();
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        clearInputBuffer();
        return;
      }

      const lowerKey = e.key.toLowerCase();
      if (KEY_TO_ZHUYIN[lowerKey]) {
        e.preventDefault();
        inputSymbol(KEY_TO_ZHUYIN[lowerKey]);
      }
    });

    loadProgress();
    renderKeyboard();
    renderAll();
  </script>
</body>
</html>
